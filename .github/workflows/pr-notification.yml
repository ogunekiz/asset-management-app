name: PR & Code Review Mail Notifications

on:
  pull_request:
    types: [opened, reopened, closed]

jobs:
  notify-pr-events:
    runs-on: ubuntu-latest
    steps:
      # 1. ADIM: PR'ı Açan Geliştiricinin Mail Adresini Dinamik Elde Etme
      - name: Extract Developer Email
        id: dev_email
        run: |
          # 1. Tercih: PR sahibinin profil maili
          PR_EMAIL="${{ github.event.pull_request.user.email }}"
          
          # 2. Tercih: Eğer gizli/boş ise varsayılan Secret mailini yedek olarak kullan
          if [ -z "$PR_EMAIL" ] || [ "$PR_EMAIL" == "null" ]; then
            PR_EMAIL="${{ secrets.MAIL_USERNAME }}"
          fi
          
          echo "PR_AUTHOR_EMAIL=$PR_EMAIL" >> $GITHUB_OUTPUT

      # 2. SENARYO: PR İnceleme Bekliyor -> REVIEWER_EMAIL adresine Mail Gönderilir
      - name: Send Mail - PR Opened / Review Requested
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[CODE REVIEW BEKLEYEN PR] ${{ github.event.pull_request.title }}"
          to: ${{ secrets.REVIEWER_EMAIL }}
          from: DevSecOps Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Merhaba Yetkili,
            
            Yeni bir Pull Request incelemenizi bekliyor.
            
            PR Başlığı: ${{ github.event.pull_request.title }}
            Açan Geliştirici: ${{ github.actor }}
            Kaynak Dal: ${{ github.event.pull_request.head.ref }}
            Hedef Dal: ${{ github.event.pull_request.base.ref }}
            PR Bağlantısı: ${{ github.event.pull_request.html_url }}
            
            Lütfen inceleyip onaylayınız veya revize isteyiniz.

      # 3. SENARYO: PR Kabul Edildi / Merge Edildi -> PR'ı Açan Geliştiriciye Mail Gönderilir
      - name: Send Mail - PR Merged
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[PR MERGE EDİLDİ ✅] ${{ github.event.pull_request.title }}"
          to: ${{ steps.dev_email.outputs.PR_AUTHOR_EMAIL }}
          from: DevSecOps Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Merhaba ${{ github.event.pull_request.user.login }},
            
            Tebrikler! Açmış olduğunuz Pull Request yetkili tarafından incelendi ve kabul edildi.
            
            PR Başlığı: ${{ github.event.pull_request.title }}
            Merge Edilen Dal: ${{ github.event.pull_request.base.ref }}
            Onaylayan / Merge Eden: ${{ github.actor }}
            PR Bağlantısı: ${{ github.event.pull_request.html_url }}
            
            Kodunuz test ve CI/CD süreçlerine aktarılıyor.

      # 4. SENARYO: PR Reddedildi / Kapatıldı -> PR'ı Açan Geliştiriciye Mail Gönderilir
      - name: Send Mail - PR Rejected / Closed
        if: github.event.action == 'closed' && github.event.pull_request.merged == false
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[PR REDDEDİLDİ ❌] ${{ github.event.pull_request.title }}"
          to: ${{ steps.dev_email.outputs.PR_AUTHOR_EMAIL }}
          from: DevSecOps Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Merhaba ${{ github.event.pull_request.user.login }},
            
            Açmış olduğunuz Pull Request kabul edilmedi ve kapatıldı.
            
            PR Başlığı: ${{ github.event.pull_request.title }}
            Kapatan / Reddeden: ${{ github.actor }}
            PR Bağlantısı: ${{ github.event.pull_request.html_url }}
            
            Lütfen PR üzerindeki yorumları inceleyerek gerekli düzenlemeleri yapınız ve yeni bir PR açınız.

        # bu satır testtir